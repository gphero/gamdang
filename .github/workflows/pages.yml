# main 에 푸시하면 빌드해서 GitHub Pages 로 올립니다.
# 공개 저장소라 Actions 사용 시간 제한이 없습니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages 에는 SPA 되돌림이 없습니다. 404 를 index 로 돌려
      # /guide/... 같은 주소로 바로 들어와도 앱이 뜨게 합니다.
      - run: cp dist/index.html dist/404.html
      # Jekyll 처리를 끕니다. 밑줄로 시작하는 파일이 사라지는 것을 막습니다.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
